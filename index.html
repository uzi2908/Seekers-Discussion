<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFE66D">
<title>Seekers Study Group – Pick your timings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#FFFBEA;--yellow:#FFE66D;--blue:#7AA2FF;--pink:#FF8FAB;--green:#7EE081;--red:#FF5C5C;--sh:5px 5px 0 var(--ink)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--yellow);
  background-image:radial-gradient(var(--ink) 1.2px,transparent 1.2px);background-size:22px 22px;min-height:100vh;padding:20px 12px 48px}
.wrap{max-width:760px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:20px}
h1{font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0 0 20px;font-size:.95rem;max-width:60ch}
.badge{display:inline-block;background:var(--pink);border:3px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.8rem;margin-bottom:12px;transform:rotate(-1.5deg)}
.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:22px}
label,.lbl{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=email]{width:100%;padding:12px;font:inherit;background:#fff;border:3px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;font-size:1.05rem;padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.85rem;font-weight:500;padding:8px 12px;min-height:40px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:0;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .08s;touch-action:manipulation}
.chip:hover{background:var(--yellow)}
.chip:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.chip[aria-pressed=true]{background:var(--blue);font-weight:700;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.prog[aria-pressed=true]{background:var(--green)}
.ds[aria-pressed=true]{background:var(--pink)}
.card{border:3px solid var(--ink);background:#fff;box-shadow:var(--sh);padding:14px;margin-bottom:18px}
.card.err{border-color:var(--red);box-shadow:5px 5px 0 var(--red)}
.card h3{margin:0;font-size:1.15rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{background:var(--yellow);border:2px solid var(--ink);font-size:.7rem;font-weight:700;padding:2px 8px}
.row-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px}
.row-head span{font-weight:700;font-size:.85rem}
.mini{font:inherit;font-size:.75rem;font-weight:700;background:none;border:0;border-bottom:2px solid var(--ink);padding:2px 0;cursor:pointer;margin-left:10px}
.days .chip{flex:1 1 56px;text-align:center}
.times{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.times .chip{text-align:center;padding:8px 4px}
.note{font-size:.8rem;margin:6px 0 0}
.empty{border:3px dashed var(--ink);padding:16px;text-align:center;font-weight:500;margin-bottom:18px}
.go{width:100%;font:inherit;font-size:1.1rem;font-weight:700;padding:16px;background:var(--ink);color:var(--yellow);border:3px solid var(--ink);box-shadow:var(--sh);cursor:pointer;transition:transform .08s,box-shadow .08s}
.go:hover{background:#2a2a2a}
.go:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.go:disabled{opacity:.6;cursor:not-allowed}
.go.ok{background:var(--green);color:var(--ink)}
#status{margin-top:16px;font-weight:700;text-align:center;min-height:1.5em}
#status.bad{color:#B00020}#status.good{color:#0B6B1E}
.hp{position:absolute;left:-9999px;opacity:0}
@media(min-width:600px){body{padding:36px 20px 64px}.wrap{padding:32px}.grid{grid-template-columns:1fr 1fr}.times{grid-template-columns:repeat(4,1fr)}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <span class="badge">Friday = day off</span>
  <h1>Seekers Study Group</h1>
  <p class="sub">Pick your courses, then tap the days and hours (9 AM – 9 PM) you can join discussions. We pick the slot most people choose.</p>

  <form id="form" novalidate>
    <div class="grid">
      <div><label for="name">Full name *</label>
        <input type="text" id="name" autocomplete="name" maxlength="80" placeholder="e.g. Ashwin" required></div>
      <div><label for="email">Email / Student ID *</label>
        <input type="text" id="email" autocomplete="email" maxlength="120" placeholder="e.g. 21f1000xxx@ds.study.iitm.ac.in" required></div>
    </div>
    <input type="text" id="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <fieldset><legend>Programming Diploma</legend><div id="progList" class="chips"></div></fieldset>
    <fieldset><legend>Data Science Diploma</legend><div id="dsList" class="chips"></div></fieldset>

    <div id="dynamicContainer" aria-live="polite"></div>
    <div id="emptyHint" class="empty">Select a course above to set its days and times.</div>

    <button type="submit" id="submitBtn" class="go">Submit preferences</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
// Paste your Apps Script Web App URL (ends with /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbxErB8eiv9mn_HAN01dNZyb6ftKACD3fSEGdBKvFQWwgJcUvV28gsrZUAxuTcJOeubh/exec";

const PROG_COURSES = ["DBMS","PDSA","MAD 1","MAD 2","Java","System Commands (SC)","MAD 1 Project","MAD 2 Project"];
const DS_COURSES = ["MLF","BDM","MLT","MLP","TDS","DL GenAI","MLP Project","DL GenAI Project","BDM Project","Business Analytics"];
const DAYS = ["Mon","Tue","Wed","Thu","Sat","Sun"]; // Friday is off
// Hourly slots 9 AM - 9 PM
const SLOTS = (() => {
  const f = h => { const s = h >= 12 ? "PM" : "AM"; const x = h % 12 || 12; return String(x).padStart(2,"0") + " " + s; };
  const out = [];
  for (let h = 9; h < 21; h++) out.push(`${f(h)} - ${f(h + 1)}`);
  return out;
})();

const $ = id => document.getElementById(id);
const selectedCourses = new Set();
const escapeId = s => s.replace(/[^a-zA-Z0-9]/g, "_");
const chipHTML = (t, extra = "") => `<button type="button" class="chip ${extra}" aria-pressed="false">${t}</button>`;

function renderButtons(containerId, list, kind) {
  const c = $(containerId);
  list.forEach(course => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `chip ${kind}`;
    b.textContent = course;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => toggleCourse(course, b);
    c.appendChild(b);
  });
}
renderButtons("progList", PROG_COURSES, "prog");
renderButtons("dsList", DS_COURSES, "ds");

function toggleCourse(course, btn) {
  const on = !selectedCourses.has(course);
  btn.setAttribute("aria-pressed", on);
  if (on) { selectedCourses.add(course); addCourseCard(course); }
  else { selectedCourses.delete(course); const c = $(`card-${escapeId(course)}`); if (c) c.remove(); }
  $("emptyHint").style.display = selectedCourses.size ? "none" : "block";
}

function addCourseCard(course) {
  const id = escapeId(course);
  const card = document.createElement("section");
  card.id = `card-${id}`;
  card.className = "card";
  card.innerHTML = `
    <div class="card-head"><h3>${course}</h3><span class="tag">Custom schedule</span></div>
    <div class="row-head"><span>Preferred days</span>
      <span><button type="button" class="mini" data-all="days">All</button><button type="button" class="mini" data-none="days">Clear</button></span></div>
    <div class="chips days" id="days-${id}">${DAYS.map(d => chipHTML(d)).join("")}</div>
    <div class="row-head"><span>Preferred time window</span>
      <span><button type="button" class="mini" data-all="times">All</button><button type="button" class="mini" data-none="times">Clear</button></span></div>
    <div class="times" id="times-${id}">${SLOTS.map(t => chipHTML(t)).join("")}</div>`;
  card.addEventListener("click", e => {
    const t = e.target;
    if (t.classList.contains("chip")) {
      t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true");
      card.classList.remove("err");
    } else if (t.dataset.all || t.dataset.none) {
      const grp = t.dataset.all || t.dataset.none;
      card.querySelectorAll(`#${grp}-${id} .chip`).forEach(b => b.setAttribute("aria-pressed", !!t.dataset.all));
      card.classList.remove("err");
    }
  });
  $("dynamicContainer").appendChild(card);
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

const picked = (group, id) =>
  Array.from(document.querySelectorAll(`#${group}-${id} .chip[aria-pressed="true"]`)).map(b => b.textContent);

function setStatus(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || ""; }

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("company").value) return; // honeypot (bots)

  const name = $("name").value.trim();
  const email = $("email").value.trim();
  if (!name || !email) return setStatus("Enter your name and email / student ID.", "bad");
  if (selectedCourses.size === 0) return setStatus("Select at least one course.", "bad");
  if (API_URL.startsWith("PASTE_")) return setStatus("Setup incomplete: add the Apps Script URL in index.html.", "bad");

  const preferences = [];
  let firstBad = null;
  selectedCourses.forEach(c => {
    const id = escapeId(c), days = picked("days", id), times = picked("times", id);
    const card = $(`card-${id}`);
    if (!days.length || !times.length) { card.classList.add("err"); firstBad = firstBad || card; }
    else preferences.push({ subject: c, days, times });
  });
  if (firstBad) {
    firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
    return setStatus("Pick at least one day and one time for each highlighted course.", "bad");
  }

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "Submitting..."; setStatus("");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    // no-cors: Apps Script redirects break CORS; the response is opaque, so success = request sent
    await fetch(API_URL, {
      method: "POST", mode: "no-cors", signal: ctrl.signal,
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ name, email, preferences })
    });
    btn.textContent = "Submitted!"; btn.classList.add("ok");
    setStatus("Done! Your preferences are on the master schedule. Resubmitting a course updates your earlier answer.", "good");
    setTimeout(() => { btn.disabled = false; btn.textContent = "Submit preferences"; btn.classList.remove("ok"); }, 4000);
  } catch (err) {
    btn.disabled = false; btn.textContent = "Submit preferences";
    setStatus(err.name === "AbortError" ? "Timed out. Check your connection and try again." : "Could not send: " + err.message, "bad");
  } finally { clearTimeout(timer); }
});
</script>
</body>
</html>
